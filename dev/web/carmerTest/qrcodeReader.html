<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>QR 코드 리더</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 16px;
      background: #111;
      color: #f5f5f5;
    }
    h1 {
      font-size: 20px;
      margin-bottom: 8px;
    }
    #video {
      width: 100%;
      max-width: 480px;
      background: #000;
      border-radius: 8px;
    }
    #result {
      margin-top: 12px;
      padding: 8px;
      background: #222;
      border-radius: 4px;
      font-size: 14px;
      word-break: break-all;
    }
    #status {
      font-size: 12px;
      color: #aaa;
      margin-top: 4px;
    }
    #controls {
      margin-top: 12px;
    }
    button {
      padding: 8px 12px;
      font-size: 14px;
      border-radius: 4px;
      border: 1px solid #555;
      background: #333;
      color: #fff;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.4;
      cursor: default;
    }
    canvas {
      display: none; /* 디버깅용으로 보고 싶으면 block으로 바꾸면 됨 */
    }
  </style>

  <!-- jsQR 라이브러리 (QR 디코딩) -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
</head>
<body>

  <h1>QR 코드 리더</h1>
  <div id="status">카메라 초기화 전</div>

  <video id="video" playsinline></video>
  <canvas id="canvas"></canvas>

  <div id="controls">
    <button id="startBtn">카메라 시작</button>
    <button id="stopBtn" disabled>정지</button>
  </div>

  <div id="result">
    <strong>읽은 결과:</strong>
    <div id="resultText">아직 스캔된 QR 코드가 없습니다.</div>
  </div>

  <script>
    // DOM 요소
    var video = document.getElementById('video');
    var canvas = document.getElementById('canvas');
    var ctx = canvas.getContext('2d');
    var statusEl = document.getElementById('status');
    var resultText = document.getElementById('resultText');
    var startBtn = document.getElementById('startBtn');
    var stopBtn = document.getElementById('stopBtn');

    var stream = null;
    var scanning = false;

    function logStatus(msg) {
      statusEl.textContent = msg;
      console.log(msg);
    }

    function startCamera() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        logStatus('이 브라우저는 카메라 접근을 지원하지 않습니다.');
        return;
      }

      // 후면 카메라 우선
      var constraints = {
        video: {
          facingMode: "environment"
        },
        audio: false
      };

      navigator.mediaDevices.getUserMedia(constraints)
        .then(function(s) {
          stream = s;
          video.srcObject = stream;
          video.play();
          scanning = true;
          startBtn.disabled = true;
          stopBtn.disabled = false;
          logStatus('카메라 시작됨. QR 코드를 화면 가운데에 맞춰주세요.');
          requestAnimationFrame(tick);
        })
        .catch(function(err) {
          logStatus('카메라 시작 실패: ' + err);
        });
    }

    function stopCamera() {
      scanning = false;
      if (stream) {
        var tracks = stream.getTracks();
        for (var i = 0; i < tracks.length; i++) {
          tracks[i].stop();
        }
        stream = null;
      }
      startBtn.disabled = false;
      stopBtn.disabled = true;
      logStatus('카메라 정지됨.');
    }

    function tick() {
      if (!scanning) {
        return;
      }

      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        var width = video.videoWidth;
        var height = video.videoHeight;

        if (width && height) {
          canvas.width = width;
          canvas.height = height;
          ctx.drawImage(video, 0, 0, width, height);

          var imageData = ctx.getImageData(0, 0, width, height);
          var code = jsQR(imageData.data, width, height);

          if (code) {
            resultText.textContent = code.data;
            logStatus('QR 코드 인식 완료!');
            // 한 번 읽으면 자동 정지하고 싶으면 아래 주석 해제
            // stopCamera();
          } else {
            // 미인식 상태
          }
        }
      }

      // 약간 쉬면서 계속 스캔 (CPU 과점유 방지)
      setTimeout(function() {
        requestAnimationFrame(tick);
      }, 150);
    }

    // 버튼 이벤트
    startBtn.addEventListener('click', function() {
      startCamera();
    });

    stopBtn.addEventListener('click', function() {
      stopCamera();
    });

    // 페이지 이탈/새로고침 시 카메라 정리
    window.addEventListener('beforeunload', function() {
      stopCamera();
    });
  </script>

</body>
</html>
